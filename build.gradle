plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    exclusiveContent {
        forRepository {
            maven {
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = "https://maven.k-4u.nl"
    }
    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url = "https://maven.gtceu.com"
    } content {
        includeGroup("com.gregtechceu.gtceu")
        includeGroup("brachy.modularui")
    }
    maven {
        url = "https://maven.firstdarkdev.xyz/snapshots"
    }
    maven {
        url = "https://maven.izzel.io/releases/"
    }content {includeGroup("icyllis.modernui")}
    maven {
        url = "https://maven.ithundxr.dev/snapshots"
    }content {includeGroup("com.tterrag.registrate")}
    maven {
        url = "https://maven.octo-studios.com/releases"
    }content {includeGroup("top.theillusivec4.curios")}
    maven {
        url = "https://modmaven.dev/"
    }
    maven {
        name = 'Configuration'
        url = 'https://repo.repsy.io/mvn/toma/public/'
    }
    maven {
        name = 'Configuration (alternative/backup)'
        url = 'https://api.repsy.io/mvn/toma/public/'
    }
    maven {
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url = 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
    maven {
        name = "CleanroomMC"
        url = "https://maven.cleanroommc.com"
        content {
            includeGroup "brachy.modularui"
        }
    }
    mavenCentral()
    mavenLocal()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        miniatureGameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file(providers.gradleProperty('miniatureGameTestDirectory').getOrElse(
                    providers.gradleProperty('miniatureWithoutMekanism').getOrElse('false').toBoolean()
                            ? 'build/miniature-gametest-no-mekanism' : 'build/miniature-gametest'))
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'flux_overdrive.miniatureWithoutMekanism',
                    providers.gradleProperty('miniatureWithoutMekanism').getOrElse('false')
            systemProperty 'flux_overdrive.miniatureWithoutGtceu',
                    providers.gradleProperty('miniatureWithoutGtceu').getOrElse('false')
            systemProperty 'flux_overdrive.miniatureWithoutJei',
                    providers.gradleProperty('miniatureWithoutJei').getOrElse('false')
            systemProperty 'flux_overdrive.miniatureWithoutEmi',
                    providers.gradleProperty('miniatureWithoutEmi').orElse(providers.gradleProperty('miniatureWithoutJei')).getOrElse('false')
            systemProperty 'flux_overdrive.miniaturePersistencePhase',
                    providers.gradleProperty('miniaturePersistencePhase').getOrElse('write')
            systemProperty 'flux_overdrive.miniatureSavedFactoryFile',
                    providers.gradleProperty('miniatureSavedFactoryFile').getOrElse('')
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets {
    clientTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

neoForge.addModdingDependenciesTo(sourceSets.clientTest)
neoForge.mods {
    flux_overdrive_client_test {
        sourceSet(sourceSets.clientTest)
    }
}
neoForge.runs.configureEach {
    loadedMods = [neoForge.mods.getByName(project.mod_id)]
}
neoForge.runs {
    miniatureClientTest {
        client()
        sourceSet = sourceSets.clientTest
        gameDirectory = project.file(providers.gradleProperty('miniatureClientTestDirectory').getOrElse('build/miniature-client-test'))
        loadedMods = [neoForge.mods.getByName(project.mod_id), neoForge.mods.flux_overdrive_client_test]
        systemProperty 'flux_overdrive.clientTestOutput', project.file(providers.gradleProperty('miniatureClientTestDirectory')
                .map { it + '/results' }.getOrElse('build/miniature-client-test/results')).absolutePath
        systemProperty 'flux_overdrive.clientTestS09Only',
                providers.gradleProperty('miniatureClientTestS09Only').getOrElse('false')
        systemProperty 'flux_overdrive.clientTestDirectionsOnly',
                providers.gradleProperty('miniatureClientTestDirectionsOnly').getOrElse('false')
        systemProperty 'flux_overdrive.clientTestS10Only',
                providers.gradleProperty('miniatureClientTestS10Only').getOrElse('false')
        systemProperty 'flux_overdrive.clientTestS11Only',
                providers.gradleProperty('miniatureClientTestS11Only').getOrElse('false')
        systemProperty 'flux_overdrive.clientTestS12Only',
                providers.gradleProperty('miniatureClientTestS12Only').getOrElse('false')
        systemProperty 'flux_overdrive.clientTestPeerRole', providers.gradleProperty('miniatureClientTestPeerRole').getOrElse('')
        systemProperty 'flux_overdrive.clientTestPeerDirectory', project.file(providers.gradleProperty('miniatureClientTestPeerDirectory')
                .getOrElse('build/s12-peer-coordination')).absolutePath
        if (providers.gradleProperty('miniatureClientTestPeerRole').isPresent()) {
            programArguments.addAll '--username', 'S12' + providers.gradleProperty('miniatureClientTestPeerRole').get()
        }
        systemProperty 'flux_overdrive.miniatureWithoutMekanism',
                providers.gradleProperty('miniatureWithoutMekanism').getOrElse('false')
        systemProperty 'flux_overdrive.miniatureWithoutGtceu',
                providers.gradleProperty('miniatureWithoutGtceu').getOrElse('false')
        systemProperty 'flux_overdrive.miniatureWithoutJei',
                providers.gradleProperty('miniatureWithoutJei').getOrElse('false')
        systemProperty 'flux_overdrive.miniatureWithoutEmi',
                providers.gradleProperty('miniatureWithoutEmi').orElse(providers.gradleProperty('miniatureWithoutJei')).getOrElse('false')
        programArguments.addAll '--width', '1280', '--height', '720'
        logLevel = org.slf4j.event.Level.INFO
    }
}

tasks.named('runMiniatureClientTest').configure {
    def clientReport = project.file(providers.gradleProperty('miniatureClientTestDirectory')
            .map { it + '/results/report.json' }.getOrElse('build/miniature-client-test/results/report.json'))
    doFirst {
        if (clientReport.exists()) clientReport.delete()
    }
    doLast {
        if (!clientReport.exists() || new groovy.json.JsonSlurper().parse(clientReport).status != 'passed') {
            throw new GradleException("Miniature client verification failed; inspect ${clientReport}")
        }
    }
}

// Development-only optional mods must not become published dependencies.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {

    // FluxNetworks
    implementation "curse.maven:fluxnetworks-248020:${fluxnetworks_version}"

    // SFM
    implementation "curse.maven:super-factory-manager-306935:7736527"

    // Mekanism
    compileOnly "mekanism:Mekanism:${deps_mekanism}:api"
    if (!providers.gradleProperty('miniatureWithoutMekanism').getOrElse('false').toBoolean()) {
        localRuntime "mekanism:Mekanism:${deps_mekanism}"
    }

    // JEI
    compileOnly "mezz.jei:jei-${mod_minecraft}-common-api:${deps_jei}"
    compileOnly "mezz.jei:jei-${mod_minecraft}-neoforge-api:${deps_jei}"
    if (!providers.gradleProperty('miniatureWithoutJei').getOrElse('false').toBoolean()) {
        localRuntime "mezz.jei:jei-${mod_minecraft}-neoforge:${deps_jei}"
    }

    // EMI
    compileOnly "maven.modrinth:emi:${deps_emi}"
    if (!providers.gradleProperty('miniatureWithoutEmi').orElse(providers.gradleProperty('miniatureWithoutJei')).getOrElse('false').toBoolean()) {
        localRuntime "maven.modrinth:emi:${deps_emi}"
    }

    // The One Probe
    implementation("mcjty.theoneprobe:theoneprobe:${deps_top}") {
        // TOP's POM brings JEI back transitively unless the absence profile removes it here too.
        if (providers.gradleProperty('miniatureWithoutJei').getOrElse('false').toBoolean()) {
            exclude(group: 'mezz.jei')
        }
    }

    // Curios
    compileOnly "top.theillusivec4.curios:curios-neoforge:${deps_curios}"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${deps_curios}"

    // GregTech CEu Modern
    if (providers.gradleProperty('miniatureWithoutGtceu').getOrElse('false').toBoolean()) {
        compileOnly("com.gregtechceu.gtceu:gtceu-${mod_minecraft}:${deps_gregtech_ceum}") {
            exclude(group: "maven.modrinth", module: "embeddium")
        }
    } else {
        implementation("com.gregtechceu.gtceu:gtceu-${mod_minecraft}:${deps_gregtech_ceum}") {
            exclude(group: "maven.modrinth", module: "embeddium")
        }
    }

    // ModularUI required by GTM
    implementation("brachy.modularui:modularui-mc1.21.1:3.3.1-SNAPSHOT")

    // Configuration
    implementation "dev.toma.configuration:configuration-1.21.1:${deps_configuration}"

    // Modern UI
    implementation("icyllis.modernui:ModernUI-NeoForge:${deps_modernui}") {
        exclude(group: "org.apache.logging.log4j", module: "log4j-core")
        exclude(group: "org.apache.logging.log4j", module: "log4j-api")
        exclude(group: "com.google.code.findbugs", module: "jsr305")
        exclude(group: "org.jetbrains", module: "annotations")
        exclude(group: "com.ibm.icu", module: "icu4j")
        exclude(group: "it.unimi.dsi", module: "fastutil")
    }
    additionalRuntimeClasspath(compileOnly("icyllis.modernui:ModernUI-Core:${deps_modernui_core}") {
        exclude(group: "org.apache.logging.log4j", module: "log4j-core")
        exclude(group: "org.apache.logging.log4j", module: "log4j-api")
        exclude(group: "com.google.code.findbugs", module: "jsr305")
        exclude(group: "org.jetbrains", module: "annotations")
        exclude(group: "com.ibm.icu", module: "icu4j")
        exclude(group: "it.unimi.dsi", module: "fastutil")
    })
    additionalRuntimeClasspath(compileOnly("icyllis.modernui:ModernUI-Markdown:${deps_modernui_markdown}") {
        exclude(group: "org.apache.logging.log4j", module: "log4j-core")
        exclude(group: "org.apache.logging.log4j", module: "log4j-api")
        exclude(group: "com.google.code.findbugs", module: "jsr305")
        exclude(group: "org.jetbrains", module: "annotations")
        exclude(group: "com.ibm.icu", module: "icu4j")
        exclude(group: "it.unimi.dsi", module: "fastutil")
    })

    // Jade
    compileOnly "maven.modrinth:jade:${deps_jade}"
    localRuntime "maven.modrinth:jade:${deps_jade}"

    // Spark profiler for development runs
    localRuntime "maven.modrinth:spark:${deps_spark}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    // Unit tests exercise model codecs that use Minecraft NBT and Direction.
    // ModDev injects those classes into main.compileClasspath but not the test source set.
    testCompileOnly files(sourceSets.main.compileClasspath)
    testRuntimeOnly files(sourceSets.main.compileClasspath)
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Expand mod metadata for builds and IDE runs.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        into 'META-INF'
    }
}

// Keep dependency sources and Javadoc available in IDEA.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
